spring.application.name=pedido-service
server.port=8082

# Configuración MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/evaluacion_pedidos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Inicialización SQL
spring.sql.init.mode=always
# ¡ESTA ES LA LÍNEA NUEVA QUE SOLUCIONA EL ERROR!
spring.jpa.defer-datasource-initialization=true 

# JWT
jwt.secret.key=tu_clave_secreta_super_segura_de_al_menos_256_bits
jwt.expiration=3600000
